[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "attribute-classifier-mcp"
version = "1.0.0"
description = "MCP Server for YOLO detection + CNN attribute classification pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["mcp", "yolo", "cnn", "attribute-classification", "object-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/your-username/attribute-classifier-mcp"
Repository = "https://github.com/your-username/attribute-classifier-mcp"
Issues = "https://github.com/your-username/attribute-classifier-mcp/issues"

[project.scripts]
attribute-classifier-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
